# docker-compose.yml — PostgreSQL for development
# Services (server, admin, public) run natively via dev.sh

services:
  postgres:
    image: postgres:16
    container_name: blogging-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: blogging_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - blogging-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  blogging-postgres-data:
